name: Publish Kaneo image

# Builds the all-in-one Kaneo image (Dockerfile.kaneo) from main, pushes it to
# ghcr.io/<owner>/<repo> as :main and :<commit>, then tells Coolify to redeploy.
# compose.coolify.fork.yml runs :main, so there is no tag to pin by hand.
#
# Manual only: Actions tab -> "Publish Kaneo image" -> "Run workflow" on main.
# To roll back, enter a full commit SHA in "rollback_to": that commit's image
# becomes :main again and Coolify redeploys it. Nothing is rebuilt.
#
# Coolify: set the repository variable COOLIFY_WEBHOOK (the app's deploy
# webhook URL) and the secret COOLIFY_TOKEN (a Coolify API token). Without
# them the image is still pushed; redeploy in Coolify yourself.

on:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Rollback: full commit SHA whose image should become :main. Leave empty to build main."
        required: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build, push and deploy
    if: ${{ github.ref == 'refs/heads/main' && !inputs.rollback_to }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          # Intel/AMD servers. Add linux/arm64 here if the server is ARM.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Coolify to deploy
        if: ${{ vars.COOLIFY_WEBHOOK != '' }}
        env:
          COOLIFY_WEBHOOK: ${{ vars.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Newer Coolify wants POST here, older wants GET: try POST, then GET.
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK" \
            || curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

  rollback:
    name: Roll back :main and deploy
    if: ${{ github.ref == 'refs/heads/main' && inputs.rollback_to }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :main at the chosen commit
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:$ROLLBACK_TO"

      - name: Tell Coolify to deploy
        if: ${{ vars.COOLIFY_WEBHOOK != '' }}
        env:
          COOLIFY_WEBHOOK: ${{ vars.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK" \
            || curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
